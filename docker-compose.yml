services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    ports:
      - "8501:8501"
    # Login (Google OAuth) + admin-notification (Gmail) credentials --
    # .dockerignore deliberately excludes .streamlit/secrets.toml from the
    # image build (never bake secrets into an image layer that could be
    # pushed/shared) -- mounted read-only at runtime instead. The VPS
    # operator creates this file directly on the VPS disk, same as
    # anywhere else this app runs; it is never committed to git.
    volumes:
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    command: ["streamlit", "run", "app/Home.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    command: ["python", "-m", "scripts.scheduler_loop"]

volumes:
  mysql_data:
